<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="How I work: embed with the team, untangle the real problem, ship the smallest fix to production, own it with alerts and runbooks then hand over.">
